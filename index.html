<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minerva — Less driving. More jobs done.</title>
    <meta name="description" content="Live GPS tracking, automatic client updates, and whole-fleet route optimization for trade and industrial businesses — cut wasted driving, fit in more jobs, and prove what you saved. Works on every phone. Set up in 20 minutes." />
    <!-- Social preview tags. og:image is a branded graphic (public/og-image.png,
         1200x630) — not a product screenshot, and not labeled as one. Same
         "no claimed screenshot" honesty rule as LandingPage.jsx's own map
         illustration: this never claims to show real app UI. -->
    <meta property="og:title" content="Minerva — Less driving. More jobs done." />
    <meta property="og:description" content="Live GPS tracking, automatic client updates, and whole-fleet route optimization for trade and industrial businesses — cut wasted driving, fit in more jobs, and prove what you saved. Works on every phone. Set up in 20 minutes." />
    <meta property="og:type" content="website" />
    <!-- minervaops.com.au is NOT actually registered yet (confirmed via
         auDA whois — see memory) — the real live site is the Vercel URL
         below. Pointing og:url/og:image/canonical at an unregistered
         domain would make link previews and search results point at a
         domain that returns nothing. Update these (and robots.txt's
         Sitemap line, and sitemap.xml) to the real custom domain once
         it's actually registered and DNS is pointed at Vercel. -->
    <meta property="og:url" content="https://minerva-green.vercel.app" />
    <meta property="og:image" content="https://minerva-green.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minerva — Less driving. More jobs done." />
    <meta name="twitter:description" content="Live GPS tracking, automatic client updates, and whole-fleet route optimization for trade and industrial businesses — cut wasted driving, fit in more jobs, and prove what you saved. Works on every phone. Set up in 20 minutes." />
    <meta name="twitter:image" content="https://minerva-green.vercel.app/og-image.png" />
    <link rel="canonical" href="https://minerva-green.vercel.app/" />
    <!-- JSON-LD structured data — only real, factual fields (name, url,
         description, the 3 real pricing tiers from LandingPage.jsx/Pricing.jsx).
         Deliberately no aggregateRating/review fields: no real reviews exist
         yet, and fabricating a rating is exactly the kind of deceptive content
         this codebase's other honesty comments (CaseStudy.jsx, LandingPage.jsx
         footer) already rule out. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Minerva",
        "url": "https://minerva-green.vercel.app",
        "description": "Live GPS tracking, automatic client updates, and whole-fleet route optimization for trade and industrial businesses — cut wasted driving, fit in more jobs, and prove what you saved. Works on every phone. Set up in 20 minutes.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web-based)",
        "offers": [
          { "@type": "Offer", "name": "Starter", "price": "49", "priceCurrency": "AUD", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "49", "priceCurrency": "AUD", "unitText": "per technician per month" } },
          { "@type": "Offer", "name": "Standard", "price": "79", "priceCurrency": "AUD", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "79", "priceCurrency": "AUD", "unitText": "per technician per month" } },
          { "@type": "Offer", "name": "Pro", "price": "119", "priceCurrency": "AUD", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "119", "priceCurrency": "AUD", "unitText": "per technician per month" } }
        ]
      }
    </script>
    <!-- PWA: lets a technician install /tech to their home screen and still
         open the app shell with no signal (see public/sw.js). Doesn't
         affect the rest of the site, which isn't installable. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#050811" />
    <!-- Mapbox CSS required for map to render correctly -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
    <!-- Arial read as dated/unpolished next to the rest of the product UI —
         Inter is the de-facto default for modern SaaS products for a reason
         (built for UI text at small sizes, real weight range). Arial stays
         first in the fallback stack below so nothing breaks if the request
         is ever blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', Arial, Helvetica, sans-serif; }
      /* Without this, mobile Safari/Chrome auto-boost small text blocks to
         a "readable" size regardless of the declared font-size or the
         width=device-width viewport meta above — found live at 375px:
         SiteFooter's 13px link row rendered at roughly 4x that size,
         overflowing the viewport by 140px with no visible scrollbar (the
         user just sees clipped content, not a scrollbar hint that more
         exists). Pins every element's rendered text to exactly its
         declared size on every device, matching the one Chrome actually
         shows in this desktop-sized dev environment, which is why this
         never surfaced until testing at an actual phone width. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
