<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minerva — Know where every technician is, right now.</title>
    <meta name="description" content="Live map tracking and automated client SMS for trade businesses. Works on every phone. Set up in 20 minutes." />
    <!-- Social preview tags. og:image is a branded graphic (public/og-image.png,
         1200x630) — not a product screenshot, and not labeled as one. Same
         "no claimed screenshot" honesty rule as LandingPage.jsx's own map
         illustration: this never claims to show real app UI. -->
    <meta property="og:title" content="Minerva — Know where every technician is, right now." />
    <meta property="og:description" content="Live map tracking and automated client SMS for trade businesses. Works on every phone. Set up in 20 minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://minervaops.com.au" />
    <meta property="og:image" content="https://minervaops.com.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minerva — Know where every technician is, right now." />
    <meta name="twitter:description" content="Live map tracking and automated client SMS for trade businesses. Works on every phone. Set up in 20 minutes." />
    <meta name="twitter:image" content="https://minervaops.com.au/og-image.png" />
    <!-- JSON-LD structured data — only real, factual fields (name, url,
         description, the 3 real pricing tiers from LandingPage.jsx/Pricing.jsx).
         Deliberately no aggregateRating/review fields: no real reviews exist
         yet, and fabricating a rating is exactly the kind of deceptive content
         this codebase's other honesty comments (CaseStudy.jsx, LandingPage.jsx
         footer) already rule out. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Minerva",
        "url": "https://minervaops.com.au",
        "description": "Live map tracking and automated client SMS for trade businesses. Works on every phone. Set up in 20 minutes.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web-based)",
        "offers": [
          { "@type": "Offer", "name": "Starter", "price": "49", "priceCurrency": "AUD", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "49", "priceCurrency": "AUD", "unitText": "per technician per month" } },
          { "@type": "Offer", "name": "Standard", "price": "79", "priceCurrency": "AUD", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "79", "priceCurrency": "AUD", "unitText": "per technician per month" } },
          { "@type": "Offer", "name": "Pro", "price": "119", "priceCurrency": "AUD", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "119", "priceCurrency": "AUD", "unitText": "per technician per month" } }
        ]
      }
    </script>
    <!-- PWA: lets a technician install /tech to their home screen and still
         open the app shell with no signal (see public/sw.js). Doesn't
         affect the rest of the site, which isn't installable. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#050811" />
    <!-- Mapbox CSS required for map to render correctly -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
