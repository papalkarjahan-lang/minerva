name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Placeholder values — this build step only checks that the code
          # compiles/bundles, it never runs against a real backend, so real
          # secrets are never needed (or exposed) here.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_MAPBOX_TOKEN: placeholder
          VITE_APP_URL: https://placeholder.example.com
